plugins {
    id "com.android.application"
}

android {
    namespace "com.xiangbei.scheduleisland"
    compileSdk 35

    defaultConfig {
        applicationId "com.xiangbei.scheduleisland"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            def preservedDebugKey = System.getenv("XIANGBEI_DEBUG_KEYSTORE")
            if (preservedDebugKey != null && !preservedDebugKey.isBlank()) {
                storeFile file(preservedDebugKey)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
